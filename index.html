    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' ? window.fetch : null;
          if (origFetch) {
            var activeFetch = origFetch.bind(window);
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { if (typeof fn === 'function') { activeFetch = fn; } },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // Ignore if already locked
            }
          }
        } catch (err) {
          // Ignore
        }
      })();
    </script>
